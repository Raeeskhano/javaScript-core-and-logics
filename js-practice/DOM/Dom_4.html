<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dom 4</title>
  </head>
  <body style="background-color: black; color: white">
    <ul class="language">
      <li>JavaScript</li>
    </ul>
  </body>

  <script>
    function addLanguage(langName) {
      const li = document.createElement("li");
      li.innerHTML = `${langName}`;
      document.querySelector(".language").appendChild(li);
    }

    addLanguage("Python");
    addLanguage("Java");

    function addOptiLanguage(language) {
      const li = document.createElement("li");
      li.appendChild(document.createTextNode(language));
      document.querySelector(".language").appendChild(li);
    }

    addOptiLanguage("C++");
    addOptiLanguage("C#");

    //Edit
    const seclang = document.querySelector("li:nth-child(2)");
    const newli = document.createElement("li");
    newli.textContent = "typescript";
    seclang.replaceWith(newli);

    //edit first language
    const firstlang = document.querySelector("li:first-child");

    const newlang = document.createElement("li");
    newlang.textContent = "Go";

    firstlang.replaceWith(newlang);

    //remove

    const lastlang = document.querySelector("li:last-child");
    lastlang.remove();
  </script>
</html>
